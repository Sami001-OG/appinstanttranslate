name: Build APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython
      
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip openjdk-17-jdk python3-pip \
            build-essential libsqlite3-dev libffi-dev libssl-dev \
            libjpeg-dev zlib1g-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x \
            gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 \
            gstreamer1.0-qt5 gstreamer1.0-pulseaudio
      
      - name: Setup Android SDK manually
        run: |
          SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p "$SDK_ROOT"
          
          # Download cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          
          # Create proper directory structure and move cmdline-tools
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
          
          # Create symlink for backward compatibility with buildozer/p4a
          mkdir -p "$SDK_ROOT/tools/bin"
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"
          
          # Verify symlink works
          ls -la "$SDK_ROOT/tools/bin/sdkmanager"
          "$SDK_ROOT/tools/bin/sdkmanager" --version
          
          rm -rf cmdline-tools commandlinetools-linux-11076708_latest.zip
          
          # Set environment variables
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
      
      - name: Accept licenses and install SDK components
        run: |
          SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          yes | $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_ROOT --licenses
          $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_ROOT "platforms;android-33" "build-tools;34.0.0" "platform-tools"
      
      - name: Build APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          cd $GITHUB_WORKSPACE
          
          # Verify SDK structure before build
          SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          echo "Checking SDK structure..."
          ls -la "$SDK_ROOT/tools/bin/sdkmanager"
          ls -la "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          
          # Force buildozer to use our SDK
          export ANDROID_SDK_ROOT=$SDK_ROOT
          export ANDROID_HOME=$SDK_ROOT
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/tools/bin:$PATH"
          
          buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-translator-apk
          path: bin/*.apk
          retention-days: 30