name: Build APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Force clean build (skip cache)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Cache buildozer
        uses: actions/cache@v4
        if: ${{ !github.event.inputs.clean_build }}
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v4
          restore-keys: |
            buildozer-${{ runner.os }}-
      
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip openjdk-17-jdk python3-pip python3-setuptools \
            build-essential libsqlite3-dev libffi-dev libssl-dev \
            libjpeg-dev zlib1g-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x \
            gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 \
            gstreamer1.0-qt5 gstreamer1.0-pulseaudio \
            autoconf libtool pkg-config cmake \
            libltdl-dev libncurses5-dev libncursesw5-dev \
            libreadline-dev libssl-dev libyaml-dev
      
      - name: Install buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir buildozer cython
      
      - name: Setup Android SDK (robust)
        env:
          ANDROID_SDK_ROOT: ${{ runner.workspace }}/.buildozer/android/platform/android-sdk
        run: |
          SDK_ROOT="$ANDROID_SDK_ROOT"
          mkdir -p "$SDK_ROOT"
          
          # Download cmdline-tools if not present
          if [ ! -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Downloading cmdline-tools..."
            cd /tmp
            wget -q --show-progress https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            mv cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
            rm -rf cmdline-tools commandlinetools-linux-11076708_latest.zip
          fi
          
          # Ensure tools/bin symlink for p4a/buildozer compatibility
          mkdir -p "$SDK_ROOT/tools/bin"
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"
          
          # Verify
          ls -la "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          ls -la "$SDK_ROOT/tools/bin/sdkmanager"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
          
          # Set environment
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
      
      - name: Accept licenses & install SDK packages
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          SDK_ROOT="$ANDROID_SDK_ROOT"
          
          # Accept all licenses
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses
          
          # Install required packages
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platforms;android-33" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;25.2.9519653"
      
      - name: Verify SDK before build
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          SDK_ROOT="$ANDROID_SDK_ROOT"
          echo "=== SDK Verification ==="
          echo "SDK_ROOT: $SDK_ROOT"
          ls -la "$SDK_ROOT/cmdline-tools/latest/bin/"
          ls -la "$SDK_ROOT/tools/bin/"
          ls -la "$SDK_ROOT/platforms/"
          ls -la "$SDK_ROOT/build-tools/"
          echo "sdkmanager version: $("$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version)"
          echo "Available build-tools: $(ls $SDK_ROOT/build-tools/)"
          echo "Available platforms: $(ls $SDK_ROOT/platforms/)"
      
      - name: Build APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          SDK_ROOT="${{ env.ANDROID_SDK_ROOT }}"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/tools/bin:$SDK_ROOT/platform-tools:$PATH"
          
          cd $GITHUB_WORKSPACE
          
          # Run buildozer with verbose output
          buildozer -v android debug 2>&1 | tee build.log
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voice-translator-apk-${{ github.sha }}
          path: bin/*.apk
          retention-days: 30
      
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: |
            build.log
            .buildozer/android/platform/build-*/build.log
          retention-days: 7